apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-core
  namespace: staging
  labels:
    app.kubernetes.io/name: ledger-core
    app.kubernetes.io/part-of: cauri
    cauri.io/team: core-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-core
        app.kubernetes.io/part-of: cauri
        cauri.io/team: core-banking
    spec:
      containers:
        - name: ledger-core
          image: ghcr.io/demo-org-np-migration/ledger-core:IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-core-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # TODO(msosa): probes, ver incidente 2025-11
