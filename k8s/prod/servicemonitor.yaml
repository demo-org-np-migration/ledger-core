apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ledger-core
  namespace: prod
  labels:
    app.kubernetes.io/name: ledger-core
    app.kubernetes.io/part-of: cauri
    cauri.io/team: core-banking
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-core
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
